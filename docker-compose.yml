services:
  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: neuralretail_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-for-neural-retail-auth}
      - DATABASE_URL=sqlite:////app/data/neuralretail.db
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: neuralretail_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data: