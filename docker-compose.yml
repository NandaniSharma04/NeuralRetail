version: '3.8'

services:
  backend:
    build: .
    container_name: neuralretail_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-for-neural-retail-auth}
      - DATABASE_URL=sqlite:////app/data/neuralretail.db
    volumes:
      # Mount a volume for the SQLite database so it persists across container restarts
      - sqlite_data:/app/data

volumes:
  sqlite_data:
